<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Русский язык и литература</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="engine.js" defer></script>
</head>
<body>

<button id="restore" onclick="toggleMenu()">☰</button>

<aside id="sidebar">

    <header class="brand">
        <div class="logo">📖</div>
        <h2>РУССКИЙ ЯЗЫК</h2>
        <p>И ЛИТЕРАТУРА</p>
        <span>1 КУРС · 80 МИНУТ</span>
    </header>

    <div class="sidebar-scroll">

        <section class="panel">

            <div id="pageNumber">1 / 1</div>

            <div class="two">
                <button id="prev" onclick="move(-1)">← Назад</button>
                <button id="next" onclick="move(1)">Далее →</button>
            </div>

        </section>

        <section id="actions" class="panel"></section>

        <section class="panel">

            <div class="label">ТАЙМЕР ЗАНЯТИЯ</div>

            <strong id="timer">80:00</strong>

            <div id="timerStage"></div>

            <div class="two">
                <button id="timerButton" onclick="toggleTimer()">Старт</button>
                <button onclick="resetTimer()">Сброс</button>
            </div>

        </section>

        <section class="panel">

            <div class="label">ПРИСУТСТВУЮТ</div>

            <strong id="attendance">24 / 25</strong>

            <button onclick="openSettings()">
                👥 Настройки учеников
            </button>

        </section>

        <section class="panel">

            <div class="label">МАСШТАБ ЭКРАНА</div>

            <div class="zoom">

                <button onclick="changeZoom(-10)">−</button>

                <strong id="zoomValue">100%</strong>

                <button onclick="changeZoom(10)">+</button>

            </div>

            <button onclick="resetZoom()">Сброс масштаба</button>

            <button onclick="fullscreen()">⛶ Полный экран</button>

            <button onclick="toggleMenu()">◀ Скрыть меню</button>

        </section>

        <section class="panel">

            <div class="label">ИНСТРУМЕНТЫ</div>

            <button onclick="openBoard()">✎ Интерактивная доска</button>

            <button onclick="openReference()">📚 Справочник</button>

            <button onclick="readPage()">🔊 Прочитать страницу</button>

            <button onclick="stopReading()">■ Остановить чтение</button>

        </section>

        <nav id="navigation"></nav>

    </div>

    <footer class="clock-panel">

        <div class="label">АЛМАТЫ · UTC+5</div>

        <strong id="clock">00:00:00</strong>

        <div id="date"></div>

        <div class="signature">BY DARKHAN</div>

    </footer>

</aside>

<main>

    <header class="topbar">

        <div>
            <h2>Русский язык и литература</h2>
            <p id="sectionName"></p>
        </div>

        <span id="lessonBadge"></span>

    </header>

    <div class="progress-track">
        <div id="progress"></div>
    </div>

    <section id="bookArea">

        <article id="page">
            Загрузка учебного материала...
        </article>

    </section>

</main>

<dialog id="settingsDialog">

    <div class="dialog-header">

        <button onclick="this.closest('dialog').close()">✕</button>

        <h2>Настройки занятия</h2>

    </div>

    <label for="studentCount">Количество присутствующих</label>

    <div class="counter">

        <button onclick="changeCount(-1)">−</button>

        <input id="studentCount"
               type="number"
               min="0"
               max="25"
               value="24"
               oninput="previewSettings()">

        <button onclick="changeCount(1)">+</button>

    </div>

    <div id="quickCount" class="quick-count"></div>

    <label for="lessonMode">Формат закрепления</label>

    <select id="lessonMode" onchange="previewSettings()">

        <option value="auto">Автоматический</option>

        <option value="individual">Индивидуальный</option>

        <option value="team">Две команды</option>

    </select>

    <div id="settingsPreview"></div>

    <button class="primary" onclick="saveSettings()">
        Сохранить настройки
    </button>

</dialog>

<dialog id="boardDialog" class="wide-dialog">

    <div class="dialog-header">

        <button onclick="this.closest('dialog').close()">✕</button>

        <h2>Интерактивная доска</h2>

    </div>

    <div class="board-layout">

        <div class="board-tools">

            <button class="pen-blue" onclick="setPen('#155bb5')">
                Синий
            </button>

            <button class="pen-red" onclick="setPen('#bc2929')">
                Красный
            </button>

            <button class="pen-green" onclick="setPen('#237747')">
                Зелёный
            </button>

            <button class="pen-black" onclick="setPen('#222222')">
                Чёрный
            </button>

            <button onclick="setPen('#ffffff')">Ластик</button>

            <label for="penWidth">Толщина линии</label>

            <input id="penWidth"
                   type="range"
                   min="2"
                   max="35"
                   value="5">

            <button onclick="undoBoard()">↶ Отменить</button>

            <button onclick="clearBoard()">Очистить</button>

        </div>

        <canvas id="boardCanvas"
                width="1400"
                height="800"></canvas>

    </div>

</dialog>

<dialog id="referenceDialog" class="wide-dialog">

    <div class="dialog-header">

        <button onclick="this.closest('dialog').close()">✕</button>

        <h2>Учебный справочник</h2>

    </div>

    <div id="referenceContent"></div>

</dialog>

<dialog id="photoDialog" class="wide-dialog">

    <button class="primary" onclick="this.closest('dialog').close()">
        ← Вернуться к уроку
    </button>

    <img id="largePhoto" alt="Иллюстрация">

    <p id="photoCaption"></p>

</dialog>

<div id="notification" role="status"></div>

</body>
</html>
